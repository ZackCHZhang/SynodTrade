# Tool hooks run from the project venv (`language: system`) so versions match poetry.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: import-linter
        name: import-linter (package DAG)
        entry: poetry run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: poetry run python tasks.py typecheck
        language: system
        pass_filenames: false
        types: [python]
