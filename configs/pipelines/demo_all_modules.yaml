# Demo pipeline: one config that uses all 6 stages and every module, to check the whole chain quickly.
# It selects stocks first (3 picks from the universe + IBKR scanner); later stages only handle the picks and existing holdings.
#
#   Offline trial run (no gateway, no API keys, no network):
#     quant run -p demo_all_modules --offline --offline-llm bullish --as-of 2026-09-30T14:00:00Z
#   Real data + real LLM, orders are recorded but not placed:
#     quant run -p demo_all_modules --dry-run
#   Real data + real LLM + orders placed on the TWS paper account:
#     quant run -p demo_all_modules --paper
#
# Default mode: dry_run; only --paper places orders on the paper account, never on real money.
# Model: DeepSeek (deepseek in configs/llm_providers.yaml; put the key in DEEPSEEK_API_KEY in .env).

name: demo_all_modules
mode: paper                 # dry_run | paper | live (live also needs QUANT_ALLOW_LIVE=1)
account: ibkr_main            # configs/accounts/ibkr_main.yaml
# With a selection stage, universe is the candidate pool; it is switched off here (include_universe: false),
# so all candidates come from the market-wide scanner and this list is only a fallback
universe: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, JPM, V, COST, LLY]
benchmark: SPY                # market benchmark: market regime, beta, relative strength (data_update refreshes its daily bars)
budget:
  max_capital: 10000          # capital of this pipeline's own virtual sub-ledger
sizing:
  buy_base: available_cash    # buy tiers are 15% / 30% of available cash
  min_one_lot_on_sell: true

stages:
  # 0. Selection: market-wide scan (4 scan lists) + watchlist -> quant screen -> each selection agent picks -> aggregate top 3
  #    -> the top 3 join the watchlist (dropped after 10 days without being picked again, at most 12); later stages handle the whole watchlist
  - type: selection
    include_universe: false      # ignore the static universe above; all candidates come from the scanner
    sources:
      - { type: ibkr_scanner,
          scan_codes: [MOST_ACTIVE, TOP_PERC_GAIN, HOT_BY_VOLUME, HIGH_VS_52W_HL],
          rows: 15, above_price: 10,
          market_cap_above: 2000,                   # market cap in millions of USD (above $2B)
          stock_type: CORP }                        # common stock only, no ETFs
    screen: { min_price: 5, min_avg_dollar_volume: 20000000, max_candidates: 25 }
    watchlist: { enabled: true, max_age_days: 10, max_size: 12 }
    fundamentals: true           # fetch SEC EDGAR fundamentals for screened candidates (needs SEC_EDGAR_USER_AGENT in .env)
    agents:
      - { agent: momentum_screener,  count: 1, weight: 1.0,
          model: { provider: deepseek, name: deepseek-chat } }
      - { agent: defensive_screener, count: 1, weight: 1.0,
          model: { provider: deepseek, name: deepseek-chat } }
      - { agent: thematic_innovation, count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: earnings_surprise_screen, count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: shareholder_yield_screen, count: 1, model: { provider: deepseek, name: deepseek-chat } }
    aggregation: { method: weighted_score, top_n: 3, min_score: 0.2 }
    max_picks_per_agent: 5
    keep_holdings: true          # holdings always stay, so they can still be sold after dropping out
    fallback: previous           # if every agent fails, reuse the previous selection

  # 1. Market data: IBKR daily history (only missing bars), quote snapshots, account and position snapshots
  - type: data_update
    timeframes: [1d]
    lookback_days: 400          # more than a year of trading days: needed by 52-week / 1-year indicators
    fundamentals: true          # also fetch fundamentals for holdings and other symbols that were not candidates

  # 2. Sentiment: three sources + two sentiment agents; skipped on failure without affecting later stages
  - type: sentiment
    on_error: skip
    sources: [reddit, stocktwits, ibkr_news]
    lookback_hours: 24
    prefilter: { max_items_per_symbol: 10, max_chars_per_item: 500 }
    agents:
      - { agent: retail_mood,     count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: event_extractor, count: 1, model: { provider: deepseek, name: deepseek-chat } }

  # 3. Decision: mostly trend / momentum agents matching the selection style; the value agent only acts as a valuation brake (weight 0.5)
  #    HOLD votes count at half weight (hold_weight: 0.5): "I don't see my setup" should not fully cancel other agents' buy votes
  - type: decision
    agents:
      - { agent: trend_follower, count: 1, weight: 1.0,
          model: { provider: deepseek, name: deepseek-chat } }
      - { agent: canslim_momentum, count: 1, weight: 1.0,
          model: { provider: deepseek, name: deepseek-chat } }
      - { agent: breakout_trader, count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: pullback_buyer, count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: value_investor, count: 1, weight: 0.5,
          model: { provider: deepseek, name: deepseek-chat } }
    aggregation: { method: weighted_vote, min_confidence: 0.5, hold_weight: 0.5 }
    bars_lookback: 260
    history_limit: 5

  # 4. Risk: hard rules first (configs/risk/default.yaml), then risk agents (can only reduce risk)
  - type: risk
    rules: default
    agents:
      - { agent: conservative_risk_officer, count: 1,
          model: { provider: deepseek, name: deepseek-chat } }
      - { agent: liquidity_checker, count: 1, model: { provider: deepseek, name: deepseek-chat } }
      - { agent: volatility_position_sizer, count: 1,
          model: { provider: deepseek, name: deepseek-chat } }
    # median: take the median of the three risk agents' verdicts (ties go to the more conservative side), so one objection is no longer a veto;
    # keep an odd number of risk agents; with an even number the lower median still leans conservative
    combine: median
    on_agent_failure: reject

  # 5. Trading: limit orders, idempotent placement, tracked until filled/cancelled (dry_run only records)
  - type: trading
    order_type: limit
    limit_offset_bps: 25        # quotes are ~15 min delayed: widen the limit by 0.25% so it fills more easily
    cancel_after_minutes: 5     # for testing: cancel if not filled within 5 minutes
