# Account sync: syncs the real state of IBKR accounts (whether orders filled, fill details,
# account and positions) into the database.
#   - First step of every live paper/live run: syncs the account that pipeline uses
#   - While the web console runs, all accounts sync every interval_minutes (editable on the "Account sync" page)
#   - Manually: "Sync now" in the web console, or `synodtrade-sync once` on the command line

enabled: true                    # scheduled automatic sync (web console / synodtrade-sync loop)
interval_minutes: 20             # automatic sync interval (minutes)
before_pipeline: true            # sync before every paper/live run
required_before_pipeline: false  # true: a failed pre-run sync fails the whole run (default: log it and continue)
gone_after_minutes: 30           # open orders IBKR no longer knows about (not open, completed, or filled) close as "cancelled" after this long unchanged
recheck_days: 3                  # orders closed within this many days are rechecked for late fills
snapshot: true                   # save account and position snapshots
accounts: []                     # only sync these account configs (configs/accounts/); empty = every account a pipeline uses
