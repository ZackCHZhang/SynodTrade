# LLM providers. An agent picks one with `model.provider: <name>` in configs/agents/*.yaml.
#
#   kind              anthropic          -> Anthropic Messages API (Claude, or any Anthropic-compatible URL)
#                     openai_compatible  -> OpenAI Chat Completions API (DeepSeek, OpenAI, Qwen, Kimi, vLLM, Ollama...)
#   base_url          endpoint; omit to use the SDK default
#   api_key_env       NAME of the environment variable holding the key (set it in .env).
#                     Keys are never written in this file.
#   structured_output (openai_compatible only) json_schema | json_object | prompt
#   max_concurrency / max_attempts / timeout_s   per-provider limits, shared by all agents using it
#   extra_headers / extra_body                   vendor-specific additions to every request
#   prices            optional list prices per model, USD per million tokens
#                     ({input, output, cache_read, cache_write}); only used to report what the
#                     LLM calls cost (quant benchmark). Models without a price show no cost.

providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    max_concurrency: 4

  deepseek:
    kind: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    structured_output: json_object   # DeepSeek supports JSON mode, not json_schema
    max_concurrency: 4

  # One key for many vendors; used by the model arena (configs/pipelines/arena_*.yaml).
  # json_object for every model, so all arena models get the same JSON instructions in the
  # prompt (some vendors behind OpenRouter do not support json_schema).
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    structured_output: json_object
    max_concurrency: 6
    extra_headers:
      HTTP-Referer: https://github.com/ZackCHZhang/synodtrade
      X-Title: SynodTrade
    # OpenRouter list prices (October 2026). OpenRouter routes each request to one of several
    # upstream providers whose prices differ, so the reported cost is an estimate.
    prices:
      deepseek/deepseek-v4.1-flash: { input: 0.15, output: 0.60, cache_read: 0.003 }
      qwen/qwen3.8-omni-flash: { input: 0.15, output: 0.47, cache_read: 0.016 }
      z-ai/glm-5.3-flashx: { input: 0.37, output: 1.25, cache_read: 0.09 }
      openai/gpt-6-luna: { input: 0.10, output: 0.50, cache_read: 0.01 }
      anthropic/claude-haiku-5.5: { input: 0.10, output: 0.50, cache_read: 0.01 }

