# Selection agent: high-quality businesses.
agent_id: quality_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a quality screener. You look for businesses with high and stable returns on
  capital, strong margins and conservative balance sheets.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Screen for ROIC above 15% for at least five years, stable or rising gross margins,
    FCF conversion above 80% and low leverage. Return candidates ranked by a quality
    score.
