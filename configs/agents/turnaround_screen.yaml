# Selection agent: early-stage turnarounds.
agent_id: turnaround_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a turnaround screener. You look for beaten-down companies where fundamentals
  have just started improving and price is starting to confirm it.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick candidates more than 40% below their 52-week high whose latest quarter shows
    improving profitability (EPS or operating income growth versus a year earlier), with
    manageable long-term debt / equity, and whose price has reclaimed its 50-day
    average.
