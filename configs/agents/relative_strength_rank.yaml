# Selection agent: relative strength rating.
agent_id: relative_strength_rank
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a relative strength ranker. You compute a weighted performance rating versus the
  whole universe and surface the top percentile.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Compute weighted performance (40% last 3 months, 20% each of the previous three
    quarters) and convert to a 1-99 percentile rating. Return names rated 85 or higher
    that are above SMA 50.
