# Selection agent: recent earnings beats with revisions.
agent_id: earnings_surprise_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are an earnings-momentum screener. You find companies that just beat expectations
  and are seeing analysts raise estimates.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Analyst estimates are not available. Pick candidates whose latest quarter shows
    strong EPS and revenue growth versus the year-ago quarter, with TTM growth
    confirming it and price holding near its highs since; the next earnings date shows
    how fresh the result is.
