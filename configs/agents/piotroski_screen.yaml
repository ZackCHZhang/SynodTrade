# Selection agent: Piotroski F-score financial strength.
agent_id: piotroski_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a financial strength screener using the Piotroski F-score. You look for cheap
  stocks whose fundamentals are actually improving.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Use the Piotroski F-score shown (computed from the filings) together with
    price/book. Prefer scores of 7-9 with low price/book; ignore candidates without
    enough signals.
