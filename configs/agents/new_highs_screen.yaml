# Selection agent: 52-week high breakout candidates.
agent_id: new_highs_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a screener for stocks making new highs. You believe new highs on strong volume
  often mark leadership rather than danger.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick candidates within about 3% of their 52-week high, with the last volume above
    its 20-day average and positive relative strength versus the benchmark.
