# Selection agent: cheap stocks on earnings and assets.
agent_id: deep_value_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a value screener looking for statistically cheap stocks. You want low prices
  relative to earnings, cash flow and book value, without obvious balance-sheet distress.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick the cheapest candidates by EV/EBIT, price/book and free cash flow yield,
    excluding those with negative free cash flow or long-term debt / equity above about
    1.5. Sector comparisons are not available; judge absolute levels.
