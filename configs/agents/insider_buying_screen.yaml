# Selection agent: insider and management buying.
agent_id: insider_buying_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are an insider activity screener. You know insiders sell for many reasons but buy
  for one, so you look for meaningful open-market purchases.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick candidates with open-market insider purchases in the last 90 days, ideally
    several of them and larger in value than insider sales. Ignore candidates without
    insider data.
