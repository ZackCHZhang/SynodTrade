# Selection agent: reliable dividend growers.
agent_id: dividend_growth_screen
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a dividend growth screener. You find companies that have raised dividends
  consistently and can keep doing so.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick candidates with a meaningful dividend yield, dividend per share growth over the
    last year above about 5%, a payout ratio below about 70% and free cash flow covering
    the dividend. Long dividend histories are not available.
