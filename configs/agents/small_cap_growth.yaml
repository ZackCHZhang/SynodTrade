# Selection agent: small-cap growth discovery.
agent_id: small_cap_growth
role: selection
prompt_version: v1
# No model here: it is chosen where the agent is instantiated (pipeline agent reference).
persona: |
  You are a small-cap growth screener. You look for under-followed smaller companies with
  fast-growing revenue and improving profitability.
prompt_template: prompts/selection_v1.j2
params:
  instructions: >-
    Pick smaller companies (market cap roughly 300M-5B) with revenue growth above about
    20%, a rising operating margin and adequate liquidity. Analyst coverage is not
    available.
