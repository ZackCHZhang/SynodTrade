[project]
name = "synodtrade-account-sync"
version = "0.1.0"
description = "Account sync: order fill status, late fills, account and position snapshots, ledger reconciliation (first pipeline step + scheduled)"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "synodtrade-core",
    "synodtrade-database",
    "synodtrade-market-data",
    "synodtrade-trading",
    "ib_async>=2.0",
    "typer>=0.12",
]

[project.scripts]
synodtrade-sync = "synodtrade_account_sync.cli:app"

[tool.poetry]
packages = [{ include = "synodtrade_account_sync", from = "src" }]

[tool.poetry.dependencies]
synodtrade-core = { path = "../core", develop = true }
synodtrade-database = { path = "../database", develop = true }
synodtrade-market-data = { path = "../market_data", develop = true }
synodtrade-trading = { path = "../trading", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
