[project]
name = "quant-webapi"
version = "0.1.0"
description = "Web 控制台后端：可视化编辑 configs/、启动流水线、实时进度、调度器、数据库浏览"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "quant-core",
    "quant-database",
    "quant-account-sync",
    "quant-pipeline",
    "quant-scheduler",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
quant-web = "quant_webapi.cli:app"

[tool.poetry]
packages = [{ include = "quant_webapi", from = "src" }]

[tool.poetry.dependencies]
quant-core = { path = "../core", develop = true }
quant-database = { path = "../database", develop = true }
quant-account-sync = { path = "../account_sync", develop = true }
quant-pipeline = { path = "../pipeline", develop = true }
quant-scheduler = { path = "../scheduler", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
