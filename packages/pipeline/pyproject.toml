[project]
name = "synodtrade-pipeline"
version = "0.1.0"
description = "Orchestration: build pipelines from YAML, multi-instance stages, failure policies, CLI"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "synodtrade-core",
    "synodtrade-database",
    "synodtrade-market-data",
    "synodtrade-selection",
    "synodtrade-sentiment",
    "synodtrade-decision",
    "synodtrade-risk",
    "synodtrade-trading",
    "synodtrade-account-sync",
    "typer>=0.12",
]

[project.scripts]
synodtrade = "synodtrade_pipeline.cli:app"

[tool.poetry]
packages = [{ include = "synodtrade_pipeline", from = "src" }]

[tool.poetry.dependencies]
synodtrade-core = { path = "../core", develop = true }
synodtrade-database = { path = "../database", develop = true }
synodtrade-market-data = { path = "../market_data", develop = true }
synodtrade-selection = { path = "../selection", develop = true }
synodtrade-sentiment = { path = "../sentiment", develop = true }
synodtrade-decision = { path = "../decision", develop = true }
synodtrade-risk = { path = "../risk", develop = true }
synodtrade-trading = { path = "../trading", develop = true }
synodtrade-account-sync = { path = "../account_sync", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
