[project]
name = "quant-scheduler"
version = "0.1.0"
description = "Scheduler: trading calendar, timed pipeline wake-ups, re-entrancy guard, health checks"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "quant-core",
    "quant-database",
    "quant-pipeline",
    "apscheduler>=3.10,<4",
    "exchange-calendars>=4.5",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
quant-scheduler = "quant_scheduler.cli:app"

[tool.poetry]
packages = [{ include = "quant_scheduler", from = "src" }]

[tool.poetry.dependencies]
quant-core = { path = "../core", develop = true }
quant-database = { path = "../database", develop = true }
quant-pipeline = { path = "../pipeline", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
