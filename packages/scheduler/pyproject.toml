[project]
name = "quant-scheduler"
version = "0.1.0"
description = "调度器：交易日历、定时唤醒流水线、防重入、健康检查"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "quant-core",
    "quant-database",
    "quant-pipeline",
]

[tool.poetry]
packages = [{ include = "quant_scheduler", from = "src" }]

[tool.poetry.dependencies]
quant-core = { path = "../core", develop = true }
quant-database = { path = "../database", develop = true }
quant-pipeline = { path = "../pipeline", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
