# Workspace root: development tooling only, not a distributable package.
# Every business package under packages/ has its own pyproject.toml and version;
# they are installed here in editable mode so one venv can lint/type-check/test all.

[project]
name = "synodtrade"
version = "0.1.0"
description = "SynodTrade: a multi-agent LLM trading system for Interactive Brokers (monorepo dev environment)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"

[tool.poetry]
package-mode = false

[tool.poetry.group.packages.dependencies]
synodtrade-core = { path = "packages/core", develop = true }
synodtrade-database = { path = "packages/database", develop = true }
synodtrade-market-data = { path = "packages/market_data", develop = true }
synodtrade-selection = { path = "packages/selection", develop = true }
synodtrade-sentiment = { path = "packages/sentiment", develop = true }
synodtrade-decision = { path = "packages/decision", develop = true }
synodtrade-risk = { path = "packages/risk", develop = true }
synodtrade-trading = { path = "packages/trading", develop = true }
synodtrade-account-sync = { path = "packages/account_sync", develop = true }
synodtrade-pipeline = { path = "packages/pipeline", develop = true }
synodtrade-scheduler = { path = "packages/scheduler", develop = true }
synodtrade-webapi = { path = "packages/webapi", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8"
mypy = ">=1.13"
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=6.0"
pytest-socket = ">=0.7"
import-linter = ">=2.1"
pre-commit = ">=4.0"
types-pyyaml = "^6.0.12.20260906"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ASYNC",        # async pitfalls
    "DTZ",          # naive datetimes are forbidden (all times must be tz-aware)
    "N",            # naming
    "PT",           # pytest style
    "TID",          # tidy imports
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # full-width CJK punctuation in strings/comments is intended
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]  # generated by Alembic

[tool.ruff.lint.isort]
known-first-party = [
    "synodtrade_core", "synodtrade_database", "synodtrade_market_data", "synodtrade_selection", "synodtrade_sentiment",
    "synodtrade_decision", "synodtrade_risk", "synodtrade_trading", "synodtrade_account_sync", "synodtrade_pipeline",
    "synodtrade_scheduler", "synodtrade_webapi",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
# Services.get("x", SomeProtocol) is the intended DI pattern; mypy flags protocols there.
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "pandas", "pandas.*", "apscheduler", "apscheduler.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not integration",
    # Unit tests must never reach the network: sockets may only talk to localhost
    # (the Windows asyncio event loop needs a loopback socketpair internally).
    "--allow-hosts=127.0.0.1,::1",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real external services (IBKR, Reddit, LLM, Postgres); skipped by default",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = [
    "synodtrade_core", "synodtrade_database", "synodtrade_market_data", "synodtrade_selection", "synodtrade_sentiment",
    "synodtrade_decision", "synodtrade_risk", "synodtrade_trading", "synodtrade_account_sync", "synodtrade_pipeline",
    "synodtrade_scheduler", "synodtrade_webapi",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
# Enforces the package DAG:
#   core <- database <- {market_data, selection, sentiment, decision, risk, trading}
#        <- account_sync <- pipeline <- scheduler <- webapi
# Business packages in the middle layer must not import each other.
[tool.importlinter]
root_packages = [
    "synodtrade_core", "synodtrade_database", "synodtrade_market_data", "synodtrade_selection", "synodtrade_sentiment",
    "synodtrade_decision", "synodtrade_risk", "synodtrade_trading", "synodtrade_account_sync", "synodtrade_pipeline",
    "synodtrade_scheduler", "synodtrade_webapi",
]

[[tool.importlinter.contracts]]
name = "Package dependency DAG"
type = "layers"
layers = [
    "synodtrade_webapi",
    "synodtrade_scheduler",
    "synodtrade_pipeline",
    "synodtrade_account_sync",
    "synodtrade_market_data | synodtrade_selection | synodtrade_sentiment | synodtrade_decision | synodtrade_risk | synodtrade_trading",
    "synodtrade_database",
    "synodtrade_core",
]
