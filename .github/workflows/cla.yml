# Asks pull request authors to sign CLA.md once; signatures are stored in signatures/cla.json
# on the `cla-signatures` branch, so the default branch can stay protected.
# Runs on pull_request_target without checking out the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ZackCHZhang/ROOT/blob/master/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ZackCHZhang,dependabot[bot],github-actions[bot]
